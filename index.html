<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수업 자료 템플릿</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style id="pageStyle"></style>
<style>
:root{
  --pri:#2b5ce6; --pri-d:#1d43b0; --pri-l:#eaf0ff;
  --bg:#f4f6fb; --card:#fff; --line:#e2e6ef; --ink:#1d2433; --sub:#5d6678;
  --o:#1f9d55; --o-l:#e3f6ea; --x:#e03e3e; --x-l:#fde8e8; --kw:#d9480f; --warn:#fff4d6;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:Pretendard,'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--pri)}

/* ---------- 상단 바 ---------- */
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand small{font-weight:500;color:var(--sub);font-size:13px}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:10px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--sub)}
.tabs button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.teacher-band{display:none;background:var(--warn);border-bottom:1px solid #f1d98a;font-size:13px;text-align:center;padding:5px 12px;color:#7a5b00}
body.teacher .teacher-band{display:block}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d);color:#fff}
.btn.warn{background:#ffd43b;border-color:#f0c419;color:#5c4400}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.del{color:var(--x)}
.btn.del:hover{border-color:var(--x)}
.btn:disabled{opacity:.4;cursor:default}

/* ---------- 레이아웃 ---------- */
main{max-width:1180px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:8px}
.card h2 .count{font-size:13px;color:var(--sub);font-weight:500}
.card h2 .right{margin-left:auto;display:flex;gap:6px}
.hint{font-size:13px;color:var(--sub);margin:4px 0 10px}
.empty{color:var(--sub);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:10px;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}

input[type=text],input[type=url],input[type=date],textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
input:focus,textarea:focus{outline:2px solid var(--pri-l);border-color:var(--pri)}
textarea{resize:vertical;min-height:70px}
label.f{display:block;font-size:12px;color:var(--sub);font-weight:600;margin-bottom:3px}
.meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:700px){.meta-grid{grid-template-columns:1fr 1fr}}
.meta-grid .wide{grid-column:span 2}

/* 수업 정보 (보기) */
.hero{background:linear-gradient(135deg,var(--pri),#5b7ff0);color:#fff;border:0}
.hero .chips{display:flex;gap:6px;flex-wrap:wrap}
.hero .chip{background:rgba(255,255,255,.18);padding:2px 10px;border-radius:99px;font-size:13px}
.hero h1{margin:10px 0 4px;font-size:28px;line-height:1.3}
.hero .unit{opacity:.9}
.hero .by{font-size:13px;opacity:.8;margin-top:8px}

/* 학습목표 */
.obj-list{margin:0;padding:0;list-style:none;counter-reset:o}
.obj-list li{counter-increment:o;display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.obj-list li:last-child{border-bottom:0}
.obj-list li::before{content:counter(o);flex:none;width:24px;height:24px;border-radius:50%;background:var(--pri-l);color:var(--pri);font-weight:700;font-size:13px;display:grid;place-items:center;margin-top:1px}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.row .n{flex:none;width:24px;text-align:center;font-weight:700;color:var(--pri)}

/* 수업 내용 */
.content p{margin:0 0 8px}
.content h4{margin:14px 0 6px;color:var(--pri);font-size:16px}
.content ul{margin:0 0 8px;padding-left:22px}
.content mark{background:#fff0e6;color:var(--kw);font-weight:700;padding:0 3px;border-radius:4px}

/* 링크 */
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.link-card{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:#fff}
.link-card:hover{border-color:var(--pri);background:var(--pri-l)}
.link-card .ic{font-size:22px}
.link-card .t{font-weight:600;line-height:1.3}
.link-card .u{font-size:12px;color:var(--sub);word-break:break-all;line-height:1.3}

/* 자료 사진 */
.gallery{display:grid;grid-template-columns:1fr 240px;gap:14px}
@media (max-width:760px){.gallery{grid-template-columns:1fr}}
.viewer{background:#f7f8fb;border:1px solid var(--line);border-radius:12px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.viewer img{max-width:100%;max-height:440px;object-fit:contain;cursor:zoom-in;display:block}
.viewer .cap{align-self:stretch;padding:8px 14px;border-top:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.viewer .cap span{color:var(--sub);font-weight:400;font-size:12px}
.viewer .err{color:var(--sub);font-size:14px;padding:30px;text-align:center}
.img-links{display:flex;flex-direction:column;gap:6px}
.img-link{text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer;color:var(--pri);text-decoration:underline;text-underline-offset:3px;font-weight:600;display:flex;gap:8px;align-items:center}
.img-link:hover{background:var(--pri-l)}
.img-link.on{background:var(--pri);color:#fff;border-color:var(--pri);text-decoration:none}
.img-edit{display:grid;grid-template-columns:24px 64px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.img-edit .thumb{width:64px;height:44px;border-radius:6px;border:1px solid var(--line);object-fit:cover;background:#f2f3f7}
.img-edit .fields{display:grid;grid-template-columns:1fr 1.6fr;gap:6px}
@media (max-width:700px){.img-edit .fields{grid-template-columns:1fr}}

/* OX 퀴즈 */
.qi{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
.qi .qn{width:30px;height:30px;border-radius:8px;background:var(--pri-l);color:var(--pri);font-weight:800;display:grid;place-items:center}
.qi.right{border-color:var(--o);background:var(--o-l)}
.qi.wrong{border-color:var(--x);background:var(--x-l)}
.qi .exp{font-size:13px;color:var(--sub);margin-top:3px}
.qi.right .exp b{color:var(--o)} .qi.wrong .exp b{color:var(--x)}
.ox{display:flex;gap:6px}
.ox button{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:800;cursor:pointer}
.ox .o{color:var(--o)} .ox .x{color:var(--x)}
.ox .o.sel{background:var(--o);border-color:var(--o);color:#fff}
.ox .x.sel{background:var(--x);border-color:var(--x);color:#fff}
.ox button:disabled{cursor:default}
.quiz-foot{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.score{font-weight:800;font-size:18px;color:var(--pri);margin-left:auto}
.qe{display:grid;grid-template-columns:30px 1fr auto;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
.qe .qn{font-weight:800;color:var(--pri);padding-top:8px;text-align:center}
.qe .flds{display:grid;gap:6px}
.qe textarea{min-height:44px}
.qe .side{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.qe .ox button{width:38px;height:38px;font-size:18px}
.qe .mv{display:flex;gap:4px}

/* ---------- 학습지 ---------- */
.ws-tools{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.ws-tools .opts{display:flex;gap:14px;flex-wrap:wrap;margin-right:auto}
.ws-tools label{display:flex;gap:5px;align-items:center;cursor:pointer;font-size:14px}
.ws-preview{display:flex;flex-direction:column;align-items:center;gap:20px;padding:10px 0 30px}
.ws-page{width:210mm;min-height:297mm;background:#fff;padding:16mm 15mm;box-shadow:0 2px 14px rgba(0,0,0,.1);font-size:11pt;line-height:1.65;color:#111}
@media (max-width:860px){.ws-preview{overflow-x:auto;align-items:flex-start}}
.ws-top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #111;padding-bottom:6px;margin-bottom:10px}
.ws-top .t{font-size:19pt;font-weight:800;line-height:1.25}
.ws-top .m{font-size:9.5pt;color:#444;text-align:right}
.ws-info{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:10pt}
.ws-info td{border:1px solid #333;padding:5px 8px}
.ws-info td.h{background:#f0f0f0;font-weight:700;width:12%;text-align:center}
.ws-sec{margin-bottom:14px;break-inside:avoid}
.ws-sec h3{font-size:12pt;margin:0 0 6px;padding:3px 10px;background:#eef1f8;border-left:5px solid var(--pri)}
.ws-sec ol,.ws-sec ul{margin:0;padding-left:22px}
.ws-sec p{margin:0 0 5px}
.ws-sec h4{margin:8px 0 3px;font-size:11pt}
.blank{display:inline-block;min-width:26mm;border-bottom:1.3px solid #111;text-align:left;padding:0 3px;margin:0 2px}
.blank b{font-size:9pt;color:#555}
.ws-ox{width:100%;border-collapse:collapse;font-size:10.5pt}
.ws-ox th,.ws-ox td{border:1px solid #555;padding:5px 8px}
.ws-ox th{background:#f0f0f0}
.ws-ox td.c{text-align:center;width:9%;white-space:nowrap}
.ws-imgs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ws-img{border:1px solid #aaa;border-radius:4px;padding:6px;break-inside:avoid}
.ws-img img{width:100%;height:42mm;object-fit:contain;display:block;background:#fafafa}
.ws-img .c{font-weight:700;font-size:10pt;margin:4px 0 2px}
.lines div{border-bottom:1px solid #999;height:8.5mm}
.ws-ans h3{border-left-color:var(--x)}
.ws-ans .ans-blank{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 14px}

/* ---------- 슬라이드 ---------- */
.slide-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.slide-tools .info{margin-right:auto;color:var(--sub);font-size:14px}
.slide-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.slide-wrap{cursor:pointer}
.slide-wrap .no{font-size:12px;color:var(--sub);margin-top:4px}
/* 슬라이드 색은 디자인 테마 변수(--s-*)로 결정 */
.slide{--s-pri:#2b5ce6;--s-bg:#fff;--s-ink:#1d2433;--s-hdr:#fff;--s-tbg:#2b5ce6;--s-tink:#fff;--s-tsub:#dce5ff;--s-kw:#d9480f;--s-muted:#8a93a6;--s-box:#eaf0ff;
  position:relative;aspect-ratio:16/9;background:var(--s-bg);border:1px solid var(--line);border-radius:8px;overflow:hidden;container-type:inline-size;color:var(--s-ink);line-height:1.45}
.slide-wrap:hover .slide{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
.slide .sh{position:absolute;left:0;top:0;right:0;height:13.3%;background:var(--s-pri);color:var(--s-hdr);font-weight:700;font-size:2.9cqw;display:flex;align-items:center;padding:0 4.5cqw}
.slide.hs-line .sh{background:none;color:var(--s-pri);left:4.5cqw;right:4.5cqw;top:3.3%;height:10.7%;padding:0;border-bottom:.3cqw solid var(--s-pri)}
.slide.hs-side .sh{background:none;color:var(--s-ink);top:3.3%;height:10.7%;padding:0 4.5cqw}
.slide.hs-side .sh::before{content:'';position:absolute;left:0;top:0;bottom:0;width:1.35cqw;background:var(--s-pri)}
.slide .sb{position:absolute;left:6cqw;right:6cqw;top:18.5%;bottom:10%;font-size:2.5cqw;overflow:hidden}
.slide .sb ol,.slide .sb ul{margin:0;padding-left:1.2em}
.slide .sb li{margin-bottom:.5em}
.slide .sb li::marker{color:var(--s-pri)}
.slide .sb p{margin:0 0 .4em}
.slide .sb .hd{color:var(--s-pri);font-weight:700}
.slide .sb b.k{color:var(--s-kw)}
.slide .sf{position:absolute;left:4.5cqw;right:4.5cqw;bottom:2.2%;font-size:1.15cqw;color:var(--s-muted);display:flex;justify-content:space-between}
.slide.title{background:var(--s-tbg);color:var(--s-tink)}
.slide.title .tb{position:absolute;left:6cqw;right:6cqw;top:21%}
.slide.title .c1{font-size:1.9cqw;color:var(--s-tsub)}
.slide.title .c2{font-size:4.6cqw;font-weight:800;margin:1.5cqw 0;line-height:1.25}
.slide.title .c3{font-size:2.3cqw}
.slide.title .c4{position:absolute;left:6cqw;bottom:9%;font-size:1.5cqw;color:var(--s-tsub)}
.slide.title .tl{position:absolute;left:6cqw;top:17%;width:9cqw;height:.6cqw;background:var(--s-tsub)}
.slide .simg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.slide .simg img{max-width:100%;max-height:100%;object-fit:contain}
.slide .q{position:absolute;left:8cqw;right:8cqw;top:20%;height:34%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:3.4cqw;font-weight:700}
.slide .q.up{top:16%;height:28%;font-size:3cqw}
.slide .qb{position:absolute;left:0;right:0;top:60%;display:flex;justify-content:center;gap:12cqw}
.slide .qb span{width:12cqw;height:12cqw;border-radius:50%;display:grid;place-items:center;font-size:7cqw;font-weight:800;color:#fff}
.slide .qb .o{background:var(--o)} .slide .qb .x{background:var(--x)}
.slide .sch{position:absolute;left:8cqw;right:8cqw;top:47%;display:grid;grid-template-columns:1fr 1fr;gap:1.4cqw;font-size:2.1cqw}
.slide .sch div{border:.2cqw solid var(--s-muted);border-radius:1.2cqw;padding:.9cqw 1.5cqw;background:var(--s-box)}
.slide .sch b{color:var(--s-pri)}
.slide.reveal .sch div.is{border-color:var(--o);background:var(--o-l);color:#1d2433;font-weight:700}
.slide .sbox{position:absolute;left:25%;right:25%;top:62%;border-bottom:.3cqw solid var(--s-ink);font-size:2.4cqw;padding-bottom:.5cqw}
.slide .sess{position:absolute;left:10cqw;right:10cqw;top:47%;bottom:15%;border:.25cqw dashed var(--s-muted);border-radius:1.2cqw}
.slide .ans{display:none;position:absolute;left:8cqw;right:8cqw;bottom:5%;text-align:center;font-size:1.9cqw;color:var(--s-ink);background:var(--s-bg)}
.slide.reveal .ans{display:block}
.slide.reveal .qb span:not(.is){opacity:.18}
.slide table{width:100%;border-collapse:collapse;font-size:1.35cqw}
.slide th,.slide td{border:1px solid var(--s-muted);padding:.35em .6em}
.slide th{background:var(--s-box)}
.slide .lnk{color:var(--s-pri);text-decoration:underline}
.slide .lnk small{color:var(--s-muted);text-decoration:none;display:block;font-size:.6em}
/* 디자인 선택 */
.theme-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.theme-pick > div > button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:6px 6px 8px;cursor:pointer;text-align:center;font-weight:700;font-size:13px;transition:transform .15s,border-color .15s}
.theme-pick > div > button:hover{transform:translateY(-3px)}
.theme-pick > div > button.on{border-color:#6d5df5;box-shadow:0 0 0 3px #e5dbff}
.theme-pick .slide{border-radius:8px;margin-bottom:6px;pointer-events:none}

/* 발표 모드 */
#present{position:fixed;inset:0;background:#0d1220;z-index:100;display:flex;align-items:center;justify-content:center}
#present .stage{width:min(100vw,calc(100vh * 16 / 9));}
#present .slide{border:0;border-radius:0}
#present .pbar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:99px;color:#fff;font-size:14px;opacity:.25;transition:opacity .2s}
#present .pbar:hover{opacity:1}
#present .pbar button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:99px;padding:5px 12px;cursor:pointer}

/* 라이트박스 */
#lightbox{position:fixed;inset:0;background:rgba(10,14,25,.88);z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;cursor:zoom-out}
#lightbox img{max-width:100%;max-height:85vh;object-fit:contain;background:#fff;border-radius:6px}
#lightbox .c{color:#fff;margin-top:12px;font-weight:600}

/* 비밀번호 창 */
#pwModal{position:fixed;inset:0;background:rgba(10,14,25,.55);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px}
#pwModal .box{background:#fff;border-radius:14px;padding:22px 24px;width:min(360px,100%);box-shadow:0 10px 40px rgba(0,0,0,.25)}
#pwModal h3{margin:0 0 4px;font-size:18px}
#pwModal .hint{margin:0 0 14px}
#pwModal input{margin-bottom:8px}
#pwModal .msg{color:var(--x);font-size:13px;min-height:20px}
#pwModal .act{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.t-only{display:none!important}
body.teacher .t-only{display:inline-flex!important}
.teacher-band .btn{margin-left:8px;vertical-align:middle}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1d2433;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200}
#toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- 인쇄 ---------- */
#printRoot{display:none}
@media print{
  body{background:#fff}
  .app,#toast,#lightbox,#present{display:none!important}
  #printRoot{display:block}
  .ws-page{width:auto;min-height:0;box-shadow:none;padding:0;margin:0}
  .ws-page + .ws-page{break-before:page}
  .print-slide{break-after:page;break-inside:avoid}
  .print-slide:last-child{break-after:auto}
  .print-slide .slide{border:1px solid #ccc;border-radius:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* =========================================================
   재미·역동 테마 (화면 전용)
   ========================================================= */
html{scroll-behavior:smooth}
body{background:#f6f4ff}
.bg-deco{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg-deco i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.4;animation:drift 18s ease-in-out infinite alternate}
.bg-deco i:nth-child(1){width:420px;height:420px;background:#a5b4fc;left:-120px;top:80px}
.bg-deco i:nth-child(2){width:360px;height:360px;background:#fbcfe8;right:-100px;top:320px;animation-duration:22s}
.bg-deco i:nth-child(3){width:380px;height:380px;background:#bbf7d0;left:30%;bottom:-160px;animation-duration:26s}
.bg-deco i:nth-child(4){width:260px;height:260px;background:#fde68a;right:22%;top:-90px;animation-duration:20s}
@keyframes drift{to{transform:translate(70px,50px) scale(1.2)}}

const STORE = 'lessonTemplate.v1';
const CIRCLED = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';

/* 교사 모드 비밀번호: 원문 대신 해시로 저장 (기본값 1234) */
function pwHash(s){
  s = 'lessonTemplate:' + s;
  let h1=0xdeadbeef, h2=0x41c6ce57;
  for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16).padStart(8,'0') + (h1>>>0).toString(16).padStart(8,'0');
}
const DEFAULT_PW = pwHash('1234');

/* 퀴즈 유형 */
const QTYPES = [['ox','OX형'],['mc4','4지 선다형'],['mcq','퀴즈형 (객관식·보기 자유)'],['short','단답형'],['essay','서술형']];
const QLABEL = Object.fromEntries(QTYPES);
const QSHORT = {ox:'OX', mc4:'4지 선다', mcq:'객관식', short:'단답형', essay:'서술형'};
const isChoice = t => t==='mc4' || t==='mcq';
function newQuestion(type){
  const q={type, q:'', a:'', choices:[], exp:''};
  if(type==='ox') q.a='O';
  if(type==='mc4'){ q.choices=['','','','']; q.a='0'; }
  if(type==='mcq'){ q.choices=['','','']; q.a='0'; }
  return q;
}
function convertQuestion(q, type){
  const n={...newQuestion(type), q:q.q, exp:q.exp};
  if(isChoice(type) && isChoice(q.type)){ n.choices=q.choices.slice(); n.a=q.a; }
  if(type==='mc4'){ n.choices=n.choices.slice(0,4); while(n.choices.length<4) n.choices.push(''); if(+n.a>3) n.a='0'; }
  if((type==='short'||type==='essay') && (q.type==='short'||q.type==='essay')) n.a=q.a;
  return n;
}
function normQ(q){
  q = q || {};
  const type = QLABEL[q.type] ? q.type : 'ox';
  const n={type, q:String(q.q||''), a:String(q.a??''), choices:Array.isArray(q.choices)?q.choices.map(String):[], exp:String(q.exp||'')};
  if(type==='ox') n.a = n.a==='X' ? 'X' : 'O';
  if(isChoice(type)){
    const min = type==='mc4' ? 4 : 2;
    if(type==='mc4') n.choices=n.choices.slice(0,4);
    while(n.choices.length<min) n.choices.push('');
    if(!(+n.a>=0 && +n.a<n.choices.length) || n.a==='') n.a='0';
  }
  return n;
}
function answerText(q){
  if(q.type==='ox') return q.a;
  if(isChoice(q.type)) return circ(+q.a+1)+' '+(q.choices[+q.a]||'');
  if(q.type==='short') return q.a.split(/[,\/]/).map(s=>s.trim()).filter(Boolean).join(' / ');
  return q.a;
}
const gradable = q => q.type!=='essay';
function isCorrect(q, ans){
  if(ans==null || String(ans).trim()==='') return false;
  if(q.type==='short'){ const nz=s=>String(s).replace(/\s+/g,'').toLowerCase(); return q.a.split(/[,\/]/).map(nz).filter(Boolean).includes(nz(ans)); }
  return String(ans)===String(q.a);
}

/* =========================================================
   유틸
   ========================================================= */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function setPath(p,v){ const ks=p.split('.'); let o=state; for(let i=0;i<ks.length-1;i++) o=o[ks[i]]; o[ks[ks.length-1]]=v; }
function circ(n){ return n<=20 ? CIRCLED[n-1] : '('+n+')'; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
function safeUrl(u){ u=String(u||'').trim(); if(!u) return ''; if(/^(https?:|data:image\/)/i.test(u)) return u; if(/^[\w.-]+\.[a-z]{2,}/i.test(u)) return 'https://'+u; return ''; }
function fileName(){ return (state.meta.title||'수업자료').replace(/[\\/:*?"<>|]/g,'').trim() || '수업자료'; }
function download(blob, name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); }
function metaLine(){ const m=state.meta; return [m.subject,m.grade].filter(Boolean).join(' · '); }

/* 수업 내용 파싱: "# 소제목", "- 목록", [핵심어] */
function parseContent(text){
  return String(text||'').split('\n').map(r=>r.trim()).filter(Boolean).map(line=>{
    if(/^#+\s*/.test(line)) return {kind:'h', text:line.replace(/^#+\s*/,'')};
    if(/^[-•*]\s+/.test(line)) return {kind:'li', text:line.replace(/^[-•*]\s+/,'')};
    return {kind:'p', text:line};
  });
}
function segs(text){ // [{t, k:bool}]
  const out=[]; let last=0; const re=/\[([^\]]+)\]/g; let m;
  while((m=re.exec(text))){ if(m.index>last) out.push({t:text.slice(last,m.index),k:false}); out.push({t:m[1],k:true}); last=re.lastIndex; }
  if(last<text.length) out.push({t:text.slice(last),k:false});
  return out;
}
function contentHTML(text, mode){ // mode: view | blank | slide
  const lines = Array.isArray(text) ? text : parseContent(text);
  let html='', inList=false, n=0; const answers=[];
  const fmt = s => segs(s).map(g=>{
    if(!g.k) return esc(g.t);
    if(mode==='view') return `<mark data-act="peek">${esc(g.t)}</mark>`;
    if(mode==='slide') return `<b class="k">${esc(g.t)}</b>`;
    n++; answers.push(g.t); return `<span class="blank"><b>${circ(n)}</b></span>`;
  }).join('');
  for(const l of lines){
    if(l.kind==='li'){ if(!inList){html+='<ul>';inList=true;} html+=`<li>${fmt(l.text)}</li>`; continue; }
    if(inList){html+='</ul>';inList=false;}
    html += l.kind==='h' ? (mode==='slide'?`<p class="hd">${fmt(l.text)}</p>`:`<h4>${fmt(l.text)}</h4>`) : `<p>${fmt(l.text)}</p>`;
  }
  if(inList) html+='</ul>';
  return {html, answers};
}

      ${answerEditor(q,i)}
      <input type="text" data-path="quiz.${i}.exp" value="${esc(q.exp)}" placeholder="해설 (선택)"></div>
      <div class="side"><div class="mv"><button class="btn sm" data-act="mvQuiz" data-i="${i}" data-d="-1" ${i===0?'disabled':''}>▲</button><button class="btn sm" data-act="mvQuiz" data-i="${i}" data-d="1" ${i===state.quiz.length-1?'disabled':''}>▼</button><button class="btn sm del" data-act="delQuiz" data-i="${i}">삭제</button></div></div></div>`).join('') || '<div class="empty">문항이 없습니다.</div>';
    h+=`<div class="quiz-foot"><select id="newQType" title="추가할 문항 유형">${qtypeOptions(lastQType)}</select><button class="btn pri" data-act="addQuiz">+ 문항 추가</button></div>`;
  }else{
    const {qs,auto,done,right}=quizStats();
    if(!qs.length) h+='<div class="empty">등록된 퀴즈가 없습니다.</div>';
    else{
      if(quizChecked){
        const essays=qs.length-auto.length;
        if(auto.length){
          const sc=Math.round(right/auto.length*100);
          const msg= sc===100?'🏆 만점! 완벽해요!': sc>=80?'🎉 훌륭해요!': sc>=60?'👍 잘했어요! 틀린 문제를 다시 볼까요?':'💪 괜찮아요, 다시 도전해 봐요!';
          h+=`<div class="result"><div class="ring" style="--p:${sc}"><b>${sc}</b></div><div><div class="rt">${msg}</div><div>자동 채점 ${auto.length}문항 중 <b>${right}개</b> 정답${essays?` · 서술형 ${essays}문항은 모범 답안과 비교해 보세요`:''}</div></div></div>`;
        }else{
          h+=`<div class="result"><div><div class="rt">📝 답안을 제출했어요!</div><div>서술형은 아래 모범 답안과 비교해 보세요.</div></div></div>`;
        }
      }else{
        h+=`<div class="qprog" id="qprog"><i style="width:${done/qs.length*100}%"></i><span>${qprogText(done,qs.length)}</span></div>`;
      }
      h+= qs.map((q,k)=>quizItemHTML(q,k)).join('');
      h+=`<div class="quiz-foot">${quizChecked?'':`<button class="btn pri" data-act="checkQuiz">✅ 채점하기</button>`}<button class="btn" data-act="resetQuiz">🔄 다시 풀기</button></div>`;
    }
  }
  h+=`</section>`;
  return h;
}

/* 교사용: 유형별 정답 입력 칸 */
function answerEditor(q,i){
  if(q.type==='ox') return `<div class="ans-row"><span class="lb">정답</span><div class="ox"><button class="o ${q.a==='O'?'sel':''}" data-act="setAns" data-i="${i}" data-v="O">O</button><button class="x ${q.a==='X'?'sel':''}" data-act="setAns" data-i="${i}" data-v="X">X</button></div></div>`;
  if(isChoice(q.type)){
    const canDel=q.type==='mcq' && q.choices.length>2, canAdd=q.type==='mcq' && q.choices.length<6;
    return `<div class="chs-edit">${q.choices.map((c,k)=>`<div class="ch-row"><button class="ch-pick ${+q.a===k?'sel':''}" data-act="setAns" data-i="${i}" data-v="${k}" title="정답으로 지정">${circ(k+1)}</button><input type="text" data-path="quiz.${i}.choices.${k}" value="${esc(c)}" placeholder="보기 ${k+1}">${canDel?`<button class="btn sm del" data-act="delChoice" data-i="${i}" data-k="${k}" title="보기 삭제">✕</button>`:''}</div>`).join('')}
      <div class="ans-row"><span class="lb">초록색 번호 = 정답</span>${canAdd?`<button class="btn sm" data-act="addChoice" data-i="${i}">+ 보기 추가</button>`:''}</div></div>`;
  }

}
/* 학생용: 유형별 문항 */
function quizItemHTML(q,k){
  const a=quizAns[q.i], has=a!=null && String(a).trim()!=='', dis=quizChecked?'disabled':'';
  const ok=isCorrect(q,a);
  const cls=quizChecked ? (gradable(q)?(ok?'right':'wrong'):'essay') : (has?'answered':'');
  let input='', side='';
  if(q.type==='ox') side=`<div class="ox"><button class="o ${a==='O'?'sel':''}" data-act="ans" data-i="${q.i}" data-v="O" ${dis}>O</button><button class="x ${a==='X'?'sel':''}" data-act="ans" data-i="${q.i}" data-v="X" ${dis}>X</button></div>`;
  if(isChoice(q.type)) input=`<div class="chs">${q.choices.map((c,j)=>{
    const mark=quizChecked?(String(j)===q.a?'correct':(String(j)===a?'bad':'')):'';
    return `<button class="ch ${String(j)===a?'sel':''} ${mark}" data-act="ans" data-i="${q.i}" data-v="${j}" ${dis}><b>${circ(j+1)}</b> ${esc(c)}</button>`;
  }).join('')}</div>`;
  if(q.type==='short') input=`<input type="text" class="sa" data-ans="${q.i}" value="${esc(a||'')}" placeholder="정답을 입력하세요" ${dis}>`;
  if(q.type==='essay') input=`<textarea class="sa" data-ans="${q.i}" placeholder="생각을 자유롭게 써 보세요" ${dis}>${esc(a||'')}</textarea>`;
  let fb='';
  if(quizChecked) fb = gradable(q)
    ? `<div class="exp"><b>${ok?'정답!':'오답'}</b> · 정답 ${esc(answerText(q))}${q.exp?' — '+esc(q.exp):''}</div>`
    : `<div class="exp"><b style="color:#5f3dc4">📝 모범 답안</b> ${esc(q.a)}${q.exp?' — '+esc(q.exp):''}</div>`;
  return `<div class="qi ${cls} t-${q.type}"><div class="qn">${k+1}</div><div><span class="qtag">${QSHORT[q.type]}</span><div>${esc(q.q)}</div>${input}${fb}</div>${side}</div>`;
}

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.createElement('canvas'); c.id='confetti'; document.body.appendChild(c);
  const g=c.getContext('2d'), W=c.width=innerWidth, H=c.height=innerHeight;
  const cols=['#ff6b6b','#ffd43b','#51cf66','#339af0','#845ef7','#f06595'];
  const ps=Array.from({length:170},()=>({x:W/2+(Math.random()-.5)*240,y:H*.4,vx:(Math.random()-.5)*18,vy:-Math.random()*17-5,s:Math.random()*8+6,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0]}));
  let t=0;
  (function f(){
    g.clearRect(0,0,W,H);
    ps.forEach(p=>{ p.vy+=.38; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle=p.c; g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); g.restore(); });
    if(++t<170) requestAnimationFrame(f); else c.remove();
  })();
}

function wsQuestion(q,i){
  const head=`<div class="wq-h"><b>${i+1}.</b><span>${esc(q.q)} <span class="wq-t">[${QSHORT[q.type]}]</span></span>${q.type==='ox'?'<span class="wq-ox">( O / X )</span>':''}</div>`;
  let body='';

  if(q.type==='short') body=`<div class="wq-short">답 : <span></span></div>`;
  if(q.type==='essay') body=`<div class="lines wq-ess"><div></div><div></div><div></div><div></div></div>`;
  return `<div class="wq">${head}${body}</div>`;
}

function buildSlides(){
  const S=[], qs=state.quiz.filter(q=>q.q.trim());
  S.push({type:'title'});
  const objs=state.objectives.filter(o=>o.trim());
  if(objs.length) S.push({type:'list', title:'학습 목표', items:objs});
  const lines=parseContent(state.content), per=7, pages=Math.ceil(lines.length/per);
  for(let i=0;i<pages;i++) S.push({type:'content', title:'수업 내용'+(pages>1?` (${i+1}/${pages})`:''), lines:lines.slice(i*per,(i+1)*per)});
  state.images.filter(im=>safeUrl(im.url)).forEach(im=>S.push({type:'image', title:im.title||'자료 사진', url:safeUrl(im.url)}));
  const ls=state.links.filter(l=>safeUrl(l.url));
  if(ls.length) S.push({type:'links', title:'수업 링크', items:ls});
  qs.forEach((q,i)=>S.push({type:'quiz', title:`퀴즈 ${i+1} / ${qs.length} · ${QSHORT[q.type]}`, q}));
  const per2=8, ap=Math.ceil(qs.length/per2);
  for(let k=0;k<ap;k++) S.push({type:'answers', title:'퀴즈 정답'+(ap>1?` (${k+1}/${ap})`:''), items:qs.slice(k*per2,(k+1)*per2), start:k*per2});
  return S;
}

function curTheme(){ const a=allThemes(); return a.find(t=>t.id===state.slideTheme) || a[0]; }
function themeVars(T){
  return `--s-pri:#${T.pri};--s-bg:#${T.bg};--s-ink:#${T.ink};--s-hdr:#${T.hdr};--s-tbg:#${T.tbg};--s-tink:#${T.tink};--s-tsub:#${T.tsub};--s-kw:#${T.kw};--s-muted:#${T.muted};--s-box:#${T.box}`
    + (T.bgImg ? `;background-image:url('${T.bgImg}');background-size:cover;background-position:center` : '');
}

function slideHTML(s, i, n, reveal, T){
  T = T || curTheme();
  const m=state.meta, st=themeVars(T);
  if(s.type==='title') return `<div class="slide title" style="${st}"><span class="tl"></span><div class="tb"><div class="c1">${esc(metaLine())}</div><div class="c2">${esc(m.title||'수업 제목')}</div><div class="c3">${esc(m.unit)}</div></div><div class="c4">${esc([m.date,m.teacher].filter(Boolean).join('   '))}</div></div>`;
  let body='';
  if(s.type==='list') body=`<div class="sb"><ol>${s.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div>`;
  if(s.type==='content') body=`<div class="sb">${contentHTML(s.lines,'slide').html}</div>`;
  if(s.type==='image') body=`<div class="sb" style="top:16%;bottom:8%"><div class="simg"><img src="${esc(s.url)}" alt=""></div></div>`;
  if(s.type==='links') body=`<div class="sb"><ul>${s.items.map(l=>`<li><span class="lnk">${esc(l.title||l.url)}<small>${esc(l.url)}</small></span></li>`).join('')}</ul></div>`;
  if(s.type==='quiz'){
    const q=s.q, ans=`<div class="ans">${q.type==='essay'?'모범 답안':'정답'}: <b>${esc(answerText(q))}</b>${q.exp?' — '+esc(q.exp):''}</div>`;
    if(q.type==='ox') body=`<div class="q">${esc(q.q)}</div><div class="qb"><span class="o ${q.a==='O'?'is':''}">O</span><span class="x ${q.a==='X'?'is':''}">X</span></div>`+ans;
    else if(isChoice(q.type)) body=`<div class="q up">${esc(q.q)}</div><div class="sch">${q.choices.map((c,k)=>`<div class="${String(k)===q.a?'is':''}"><b>${circ(k+1)}</b> ${esc(c)}</div>`).join('')}</div>`+ans;
    else if(q.type==='short') body=`<div class="q">${esc(q.q)}</div><div class="sbox">답 :</div>`+ans;
    else body=`<div class="q up">${esc(q.q)}</div><div class="sess"></div>`+ans;
  }
  if(s.type==='answers') body=`<div class="sb" style="top:17%;bottom:8%"><table><tr><th style="width:6%">번호</th><th style="width:11%">유형</th><th>문제</th><th style="width:26%">정답</th></tr>${s.items.map((q,k)=>`<tr><td style="text-align:center">${(s.start||0)+k+1}</td><td style="text-align:center">${QSHORT[q.type]}</td><td>${esc(q.q)}</td><td style="font-weight:700;${q.type==='ox'?`text-align:center;color:${q.a==='O'?'var(--o)':'var(--x)'}`:''}">${esc(answerText(q))}</td></tr>`).join('')}</table></div>`;
  return `<div class="slide hs-${T.style} ${reveal?'reveal':''}" style="${st}"><div class="sh">${esc(s.title)}</div>${body}<div class="sf"><span>${esc([m.subject,m.title].filter(Boolean).join(' | '))}</span><span>${i+1} / ${n}</span></div></div>`;
}

/* =========================================================
   파워포인트 저장 (PptxGenJS)
   ========================================================= */
function toPng(url){
  return new Promise(res=>{
    const img=new Image(); let done=false;
    const fin=v=>{ if(!done){done=true;res(v);} };
    if(!/^data:/.test(url)) img.crossOrigin='anonymous';
    img.onload=()=>{
      try{
        let w=img.naturalWidth||960, h=img.naturalHeight||600; const sc=Math.min(1,2000/Math.max(w,h));
        const c=document.createElement('canvas'); c.width=Math.round(w*sc); c.height=Math.round(h*sc);
        const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
        fin({data:c.toDataURL('image/png'), w:c.width, h:c.height});
      }catch(e){ fin(null); }
    };
    img.onerror=()=>fin(null);
    setTimeout(()=>fin(null),10000);
    img.src=url;
  });
}
async function exportPpt(){
  if(!window.PptxGenJS){ toast('PPT 기능을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침 하세요.'); return; }
  toast('파워포인트 파일을 만드는 중입니다…');
  const m=state.meta, S=buildSlides(), F='맑은 고딕', W=13.333;
  const P=new PptxGenJS(); P.layout='LAYOUT_WIDE'; P.title=m.title||'수업 자료'; P.author=m.teacher||'';
  const T=curTheme(), PRI=T.pri, INK=T.ink, KW=T.kw, GRAY=T.muted;
  let fails=0;
  for(let i=0;i<S.length;i++){
    const s=S[i], sl=P.addSlide();
    sl.background = T.bgImg ? {data:T.bgImg} : {color: s.type==='title' ? T.tbg : T.bg};
    if(s.type==='title'){
      sl.addShape('rect',{x:.8,y:1.22,w:1.2,h:.08,fill:{color:T.tsub},line:{color:T.tsub}});
      sl.addText(metaLine(),{x:.8,y:1.5,w:11.7,h:.5,fontSize:18,color:T.tsub,fontFace:F});
      sl.addText(m.title||'수업 제목',{x:.8,y:2.05,w:11.7,h:1.7,fontSize:44,bold:true,color:T.tink,fontFace:F,valign:'middle'});
      sl.addText(m.unit||'',{x:.8,y:3.8,w:11.7,h:.6,fontSize:22,color:T.tink,fontFace:F});
      sl.addText([m.date,m.teacher].filter(Boolean).join('   '),{x:.8,y:6.4,w:11.7,h:.4,fontSize:14,color:T.tsub,fontFace:F});
      continue;
    }
    if(T.style==='bar'){
      sl.addShape('rect',{x:0,y:0,w:W,h:1.0,fill:{color:PRI},line:{color:PRI}});
      sl.addText(s.title,{x:.6,y:0,w:W-1.2,h:1.0,fontSize:28,bold:true,color:T.hdr,fontFace:F,valign:'middle'});
    }else if(T.style==='line'){
      sl.addText(s.title,{x:.6,y:.25,w:W-1.2,h:.8,fontSize:28,bold:true,color:PRI,fontFace:F,valign:'middle',margin:0});
      sl.addShape('line',{x:.6,y:1.05,w:W-1.2,h:0,line:{color:PRI,width:3}});
    }else{
      sl.addShape('rect',{x:0,y:.25,w:.18,h:.8,fill:{color:PRI},line:{color:PRI}});
      sl.addText(s.title,{x:.6,y:.25,w:W-1.2,h:.8,fontSize:28,bold:true,color:INK,fontFace:F,valign:'middle'});
    }
    sl.addText([m.subject,m.title].filter(Boolean).join(' | '),{x:.6,y:7.0,w:9,h:.35,fontSize:11,color:GRAY,fontFace:F});
    sl.addText(`${i+1} / ${S.length}`,{x:W-2.6,y:7.0,w:2,h:.35,fontSize:11,color:GRAY,fontFace:F,align:'right'});
    const box={x:.8,y:1.4,w:W-1.6,h:5.4};

    if(s.type==='list'){
      sl.addText(s.items.map(t=>({text:t,options:{bullet:{type:'number'},breakLine:true}})),{...box,fontSize:24,fontFace:F,color:INK,valign:'top',paraSpaceAfter:14});
    }
    if(s.type==='content'){
      const runs=[];
      s.lines.forEach(l=>{
        const po = l.kind==='li' ? {bullet:true} : {bullet:false};
        const g=segs(l.text);
        g.forEach((x,k)=>runs.push({text:x.t,options:{...po,bold:l.kind==='h'||x.k,color:l.kind==='h'?PRI:(x.k?KW:INK),breakLine:k===g.length-1}}));
      });
      if(runs.length) sl.addText(runs,{...box,fontSize:22,fontFace:F,valign:'top',paraSpaceAfter:10});
    }
    if(s.type==='image'){
      const d=await toPng(s.url);
      if(d){
        const bx={x:.8,y:1.25,w:W-1.6,h:5.6}, r=Math.min(bx.w/d.w,bx.h/d.h), w=d.w*r, h=d.h*r;
        sl.addImage({data:d.data,x:bx.x+(bx.w-w)/2,y:bx.y+(bx.h-h)/2,w,h});
      }else{
        fails++;
        sl.addText([{text:'이 사진은 사이트 보안 설정 때문에 파일에 넣지 못했습니다.\n',options:{color:GRAY,fontSize:18}},{text:'▶ 사진 열기: '+s.url,options:{hyperlink:{url:s.url},color:PRI,fontSize:16}}],{...box,fontFace:F,align:'center',valign:'middle'});
      }
    }
    if(s.type==='links'){
      const runs=[];
      s.items.forEach(l=>{ runs.push({text:l.title||l.url,options:{bullet:true,hyperlink:{url:l.url},color:PRI,fontSize:24,breakLine:true}}); runs.push({text:l.url,options:{bullet:false,indentLevel:1,color:GRAY,fontSize:14,breakLine:true}}); });
      sl.addText(runs,{...box,fontFace:F,valign:'top',paraSpaceAfter:6});
    }
    if(s.type==='quiz'){
      const q=s.q, tall=q.type==='ox'||q.type==='short';
      sl.addText(q.q,{x:1,y:tall?1.5:1.25,w:W-2,h:tall?2.4:1.9,fontSize:tall?32:28,bold:true,fontFace:F,color:INK,align:'center',valign:'middle'});
      if(q.type==='ox'){
        sl.addShape('ellipse',{x:3.6,y:4.3,w:1.9,h:1.9,fill:{color:'1F9D55'},line:{color:'1F9D55'}});
        sl.addText('O',{x:3.6,y:4.3,w:1.9,h:1.9,fontSize:66,bold:true,color:'FFFFFF',align:'center',valign:'middle',fontFace:F});
        sl.addShape('ellipse',{x:7.8,y:4.3,w:1.9,h:1.9,fill:{color:'E03E3E'},line:{color:'E03E3E'}});
        sl.addText('X',{x:7.8,y:4.3,w:1.9,h:1.9,fontSize:66,bold:true,color:'FFFFFF',align:'center',valign:'middle',fontFace:F});
      }else if(isChoice(q.type)){
        q.choices.forEach((c,k)=>{
          const x=.9+(k%2)*5.85, y=3.35+Math.floor(k/2)*1.1;
          sl.addShape('roundRect',{x,y,w:5.6,h:.92,rectRadius:.12,fill:{color:T.box},line:{color:GRAY,width:1}});
          sl.addText([{text:circ(k+1)+'  ',options:{color:PRI,bold:true}},{text:c,options:{color:INK}}],{x:x+.15,y,w:5.3,h:.92,fontSize:20,fontFace:F,valign:'middle'});
        });
      }else if(q.type==='short'){
        sl.addText('답 :',{x:3.2,y:4.6,w:1,h:.6,fontSize:22,color:INK,fontFace:F,valign:'bottom'});
        sl.addShape('line',{x:3.2,y:5.25,w:6.9,h:0,line:{color:INK,width:2}});
      }else{
        sl.addShape('roundRect',{x:1.2,y:3.35,w:W-2.4,h:3.3,rectRadius:.15,fill:{color:T.bg},line:{color:GRAY,width:1.5,dashType:'dash'}});
      }
      sl.addNotes(`${q.type==='essay'?'모범 답안':'정답'}: ${answerText(q)}${q.exp?'\n해설: '+q.exp:''}`);
    }
    if(s.type==='answers'){
      const hd=t=>({text:t,options:{bold:true,fill:{color:T.box},align:'center'}});
      const rows=[[hd('번호'),hd('유형'),hd('문제'),hd('정답'),hd('해설')]].concat(s.items.map((q,k)=>[
        {text:String((s.start||0)+k+1),options:{align:'center'}},{text:QSHORT[q.type],options:{align:'center'}},q.q,
        {text:answerText(q),options:{bold:true,align:q.type==='ox'?'center':'left',color:q.type==='ox'?(q.a==='O'?'1F9D55':'E03E3E'):INK}},q.exp||'']));
      sl.addTable(rows,{x:.6,y:1.25,w:W-1.2,colW:[.7,1.2,5.2,2.7,2.333],fontSize:12,fontFace:F,color:INK,border:{type:'solid',pt:.75,color:GRAY},valign:'middle'});
    }
  }
  try{
    await P.writeFile({fileName:fileName()+'.pptx'});
    toast(fails?`PPT 저장 완료 (사진 ${fails}장은 링크로 대체)`:'PPT 파일을 저장했습니다.');
  }catch(e){ console.error(e); toast('PPT 저장 중 오류가 발생했습니다.'); }
}

function fileToData(file){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=1600, sc=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
        const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',.85));
      };
      img.onerror=()=>res(fr.result);
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function move(arr,i,d){ const j=i+d; if(j<0||j>=arr.length) return; [arr[i],arr[j]]=[arr[j],arr[i]]; }

document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, i=+el.dataset.i, v=el.dataset.v, d=+el.dataset.d;
  const edit=fn=>{ fn(); save(); render(); };
  switch(act){
    case 'tab': tab=v; render(true); window.scrollTo({top:0,behavior:'instant'}); break;
    case 'mode':
      if(teacher){ teacher=false; render(true); toast('수정을 마쳤습니다. 학생 화면으로 전환합니다.'); }
      else openPwLogin();
      break;
    case 'chpw': openPwChange(); break;
    case 'addObj': edit(()=>state.objectives.push('')); break;
    case 'delObj': edit(()=>state.objectives.splice(i,1)); break;
    case 'addLink': edit(()=>state.links.push({title:'',url:''})); break;
    case 'delLink': edit(()=>state.links.splice(i,1)); break;
    case 'addImg': edit(()=>{ state.images.push({title:'',url:''}); curImg=state.images.length-1; }); break;
    case 'delImg': edit(()=>state.images.splice(i,1)); break;
    case 'mvImg': edit(()=>{ move(state.images,i,d); curImg=i+d; }); break;
    case 'showImg': {
      curImg=i;
      const vw=$('#viewer'); if(vw) vw.innerHTML=viewerHTML(state.images[i]);
      document.querySelectorAll('.img-link').forEach((b,k)=>b.classList.toggle('on',k===i));
      break;
    }
    case 'objDone': {
      objDone.has(i)?objDone.delete(i):objDone.add(i);
      el.classList.toggle('done',objDone.has(i));
      const n=document.querySelectorAll('.obj-list li').length;
      $('#objMeter').innerHTML=objMeterHTML(n);
      if(objDone.size===n && el.classList.contains('done')) confetti();
      break;
    }
    case 'hideKw':
      hideKw=!hideKw;
      $('.content')?.classList.toggle('hidekw',hideKw);
      document.querySelectorAll('.content mark.peek').forEach(mk=>mk.classList.remove('peek'));
      el.textContent=hideKw?'👀 핵심어 보이기':'🙈 핵심어 가리기';
      if(hideKw) toast('가려진 핵심어를 눌러 정답을 확인해 보세요!');
      break;
    case 'peek': if(hideKw) el.classList.toggle('peek'); break;
    case 'zoom': {
      const im=state.images[curImg]; if(!im) break;
      const lb=$('#lightbox'); lb.innerHTML=`<img src="${esc(safeUrl(im.url))}" alt=""><div class="c">${esc(im.title)}</div>`; lb.hidden=false; break;
    }
    case 'addQuiz': edit(()=>state.quiz.push(newQuestion(lastQType))); setTimeout(()=>{ const t=document.querySelectorAll('.qe textarea[data-path$=".q"]'); t[t.length-1]?.focus(); },0); break;
    case 'addChoice': edit(()=>state.quiz[i].choices.push('')); break;
    case 'delChoice': edit(()=>{
      const q=state.quiz[i], k=+el.dataset.k, a=+q.a;
      q.choices.splice(k,1);
      q.a = String(a===k ? 0 : a>k ? a-1 : a);
    }); break;
    case 'pickTheme': state.slideTheme=v; save(); render(); toast(`'${curTheme().name}' 디자인을 적용했습니다.`); break;
    case 'addTheme': themeEdit=newCustomTheme(); render(); setTimeout(()=>$('#tePreview')?.scrollIntoView({block:'center'}),50); break;
    case 'editTheme': themeEdit={...state.customThemes.find(c=>c.id===v)}; render(); setTimeout(()=>$('#tePreview')?.scrollIntoView({block:'center'}),50); break;
    case 'delTheme': {
      const c=state.customThemes.find(x=>x.id===v);
      if(!c || !confirm(`'${c.name}' 템플릿을 삭제할까요?`)) break;
      edit(()=>{ state.customThemes=state.customThemes.filter(x=>x.id!==v); if(state.slideTheme===v) state.slideTheme='classic'; if(themeEdit?.id===v) themeEdit=null; });
      break;
    }
    case 'teStyle': themeEdit.style=v; el.parentNode.querySelectorAll('.btn').forEach(b=>b.classList.toggle('pri',b===el)); $('#tePreview').innerHTML=themePreviewHTML(); break;
    case 'teNoImg': themeEdit.bgImg=''; render(); break;
    case 'teCancel': themeEdit=null; render(); break;
    case 'teSave': {
      themeEdit.name=themeEdit.name.trim()||'내 템플릿';
      const k=state.customThemes.findIndex(c=>c.id===themeEdit.id);
      if(k>=0) state.customThemes[k]=themeEdit; else state.customThemes.push(themeEdit);
      state.slideTheme=themeEdit.id; themeEdit=null; save(); render();
      toast('내 템플릿을 저장하고 적용했습니다.');
      break;
    }
    case 'delQuiz': if(state.quiz[i].q.trim() && !confirm(`${i+1}번 문항을 삭제할까요?`)) break; edit(()=>state.quiz.splice(i,1)); break;
    case 'mvQuiz': edit(()=>move(state.quiz,i,d)); break;
    case 'setAns': edit(()=>state.quiz[i].a=v); break;
    case 'ans': {
      quizAns[i]=v;
      el.parentNode.querySelectorAll('button').forEach(b=>{ b.classList.toggle('sel',b.dataset.v===v); b.classList.remove('pop'); });
      void el.offsetWidth; el.classList.add('pop');
      el.closest('.qi').classList.add('answered');
      updateQuizProg();
      break;
    }
    case 'checkQuiz': {
      const st=quizStats(), left=st.qs.length-st.done;
      if(left && !confirm(`아직 풀지 않은 문항이 ${left}개 있습니다. 채점할까요?`)) break;
      quizChecked=true; render();
      $('#s-quiz')?.scrollIntoView({block:'start'});
      if(st.auto.length && st.right/st.auto.length>=.8) setTimeout(confetti,250);
      break;
    }
    case 'resetQuiz': quizAns={}; quizChecked=false; render(); break;
    case 'printWs': printHTML(worksheetHTML(),'portrait'); break;
    case 'printSlides': { const S=buildSlides(); printHTML(S.map((s,k)=>`<div class="print-slide">${slideHTML(s,k,S.length,false)}</div>`).join(''),'landscape'); break; }
    case 'exportPpt': exportPpt(); break;
    case 'present': openPresent(i); break;
    case 'pnext': e.stopPropagation(); if(presentIdx<presentSlides.length-1){presentIdx++; drawPresent();} break;
    case 'pprev': e.stopPropagation(); if(presentIdx>0){presentIdx--; drawPresent();} break;
    case 'preveal': e.stopPropagation(); drawPresent(true); break;
    case 'pclose': e.stopPropagation(); closePresent(); break;
    case 'saveJson': download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}), fileName()+'.json'); toast('수업 자료 파일(.json)을 저장했습니다.'); break;
    case 'loadJson': $('#jsonFile').click(); break;
  }
});
$('#lightbox').addEventListener('click',()=>{ $('#lightbox').hidden=true; });

document.addEventListener('input', e=>{
  const t=e.target;
  if(t.dataset.ans!==undefined){ // 학생 단답·서술 답안
    quizAns[+t.dataset.ans]=t.value;
    t.closest('.qi').classList.toggle('answered', !!t.value.trim());
    updateQuizProg();
  }
  if(t.dataset.te && themeEdit){ // 내 템플릿 편집
    themeEdit[t.dataset.te] = t.type==='color' ? t.value.slice(1).toUpperCase() : t.value;
    $('#tePreview').innerHTML=themePreviewHTML();
  }
  if(t.dataset.path){
    setPath(t.dataset.path, t.value); save();
    if(t.dataset.img!==undefined){ // 사진 주소 입력 → 미리보기 즉시 반영
      const i=+t.dataset.img; curImg=i;
      const vw=$('#viewer'); if(vw) vw.innerHTML=viewerHTML(state.images[i]);
      document.querySelectorAll('.img-link').forEach((b,k)=>b.classList.toggle('on',k===i));
      const th=t.closest('.img-edit').querySelector('.thumb');
      if(th && th.tagName==='IMG'){ th.style.visibility=''; th.src=safeUrl(t.value); }
    }
    if(/^images\.\d+\.title$/.test(t.dataset.path)){
      const i=+t.dataset.path.split('.')[1], b=document.querySelectorAll('.img-link')[i];
      const sp=b && b.querySelector('span'); if(sp) sp.textContent=t.value||'사진 '+(i+1);
    }
  }
});
document.addEventListener('change', async e=>{
  const t=e.target;
  if(t.dataset.ws){ state.ws[t.dataset.ws]=t.checked; save(); $('.ws-preview').innerHTML=worksheetHTML(); }
  if(t.dataset.qtype!==undefined){ const i=+t.dataset.qtype; state.quiz[i]=convertQuestion(state.quiz[i],t.value); save(); render(); }
  if(t.id==='newQType') lastQType=t.value;
  if(t.dataset.tefile!==undefined && t.files[0] && themeEdit){
    themeEdit.bgImg=await fileToData(t.files[0]);
    render(); toast('배경 이미지를 넣었습니다. 글자가 잘 보이는지 미리보기로 확인하세요.');
  }
  if(t.dataset.file!==undefined && t.files[0]){
    const i=+t.dataset.file, f=t.files[0];
    const data=await fileToData(f);
    state.images[i].url=data;
    if(!state.images[i].title) state.images[i].title=f.name.replace(/\.[^.]+$/,'');
    curImg=i; save(); render(); toast('사진을 올렸습니다.');
  }
  if(t.id==='jsonFile' && t.files[0]){
    try{
      const d=JSON.parse(await t.files[0].text());
      state=normalize(d); quizAns={}; quizChecked=false; objDone=new Set(); curImg=0; save(); render(true); toast('수업 자료를 불러왔습니다.');
    }catch(err){ toast('파일을 읽을 수 없습니다. 이 템플릿에서 저장한 .json 파일인지 확인하세요.'); }
    t.value='';
  }
});
document.addEventListener('keydown', e=>{
  if(!$('#present').hidden){
    if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){ e.preventDefault(); if(presentIdx<presentSlides.length-1){presentIdx++; drawPresent();} }
    else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){ e.preventDefault(); if(presentIdx>0){presentIdx--; drawPresent();} }
    else if(e.key==='Escape') closePresent();
    else if(e.key.toLowerCase()==='a' && presentSlides[presentIdx].type==='quiz') drawPresent(true);
    return;
  }
  if(e.key==='Escape') $('#lightbox').hidden=true;
});
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement && !$('#present').hidden) closePresent(); });

/* 교사 모드 비밀번호 창 */
function pwModal(html, onOk){
  const m=$('#pwModal');
  m.innerHTML=`<form class="box" autocomplete="off">${html}<div class="msg"></div><div class="act"><button type="button" class="btn" data-pw="cancel">취소</button><button type="submit" class="btn pri">확인</button></div></form>`;
  m.hidden=false;
  const form=m.querySelector('form'), msg=m.querySelector('.msg');
  form.querySelector('input').focus();
  form.addEventListener('submit',ev=>{ ev.preventDefault(); const err=onOk(form); if(err){ msg.textContent=err; form.querySelector('input').select(); } else closePwModal(); });
  m.querySelector('[data-pw=cancel]').addEventListener('click',closePwModal);
}
function closePwModal(){ $('#pwModal').hidden=true; $('#pwModal').innerHTML=''; }
$('#pwModal').addEventListener('mousedown',e=>{ if(e.target.id==='pwModal') closePwModal(); });
function openPwLogin(){
  pwModal(`<h3>🔒 교사 모드</h3><p class="hint">교사 비밀번호를 입력하세요.</p><input type="password" name="pw" placeholder="비밀번호" inputmode="numeric">`, f=>{
    if(pwHash(f.pw.value)!==state.pw) return '비밀번호가 맞지 않습니다.';
    teacher=true; render(true);
    toast(state.pw===DEFAULT_PW?'교사 모드입니다. 초기 비밀번호(1234)를 사용 중이니 [🔒 비밀번호 변경]을 권장합니다.':'교사 모드: 내용을 수정할 수 있습니다.');
  });
}
function openPwChange(){
  pwModal(`<h3>🔒 비밀번호 변경</h3><p class="hint">새 비밀번호는 4자 이상으로 정하세요.</p>
    <label class="f">현재 비밀번호</label><input type="password" name="cur">
    <label class="f">새 비밀번호</label><input type="password" name="nw">
    <label class="f">새 비밀번호 확인</label><input type="password" name="nw2">`, f=>{
    if(pwHash(f.cur.value)!==state.pw) return '현재 비밀번호가 맞지 않습니다.';
    if(f.nw.value.length<4) return '새 비밀번호는 4자 이상이어야 합니다.';
    if(f.nw.value!==f.nw2.value) return '새 비밀번호가 서로 다릅니다.';
    state.pw=pwHash(f.nw.value); save();
    toast('비밀번호를 변경했습니다. [💾 파일 저장]한 파일에도 새 비밀번호가 적용됩니다.');
  });
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('#pwModal').hidden) closePwModal(); });

/* 교사 모드에서 '새 수업' */
(function addExtraTools(){
  const tools=document.querySelector('.tools');
  tools.insertAdjacentHTML('beforeend',`<button class="btn t-only" id="newBtn" title="빈 템플릿으로 새로 시작">🆕 새 수업</button>`);
  $('#newBtn').addEventListener('click',()=>{
    if(!confirm('현재 내용을 지우고 빈 템플릿(OX 10문항)으로 시작할까요?\n필요하면 먼저 [💾 파일 저장]을 해 두세요.')) return;
    const pw=state.pw;
    state=blankLesson(); state.pw=pw; quizAns={}; quizChecked=false; curImg=0; teacher=true; tab='lesson'; save(); render();
  });
})();

/* 스크롤 진행 막대 */
addEventListener('scroll',()=>{
  const d=document.documentElement;
  $('.sprog').style.width=(d.scrollTop/((d.scrollHeight-d.clientHeight)||1)*100)+'%';
},{passive:true});

render(true);
</script>
